<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lázeňský Commander - privátní feed</title>
<style>
  body{max-width:980px;margin:32px auto;padding:0 18px;background:#020617;color:#e2e8f0;font:16px/1.45 system-ui,sans-serif}
  h1{margin-bottom:4px} p{color:#cbd5e1} section{margin:18px 0;padding:16px;border:1px solid #334155;border-radius:14px;background:#0f172a}
  label{display:block;margin-top:12px;font-weight:700} textarea{display:block;width:100%;min-height:150px;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #475569;border-radius:8px;background:#020617;color:#e2e8f0;font:13px/1.35 ui-monospace,monospace}
  button{margin:10px 8px 0 0;padding:9px 12px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#f8fafc;font-weight:750}.status{min-height:24px;color:#99f6e4;font-weight:700}
</style>
<h1>Privátní feed Lázeňského Commanderu</h1>
<p>Nástroj používá pouze veřejný RSA klíč Petra. Potvrzený rozpis ani žádný soukromý klíč nikam neodesílá.</p>
<section>
  <button id="loadPublicKey">Načíst produkční veřejný klíč</button>
  <label>Veřejný klíč pro rozpis<textarea id="publicKey" spellcheck="false"></textarea></label>
  <label>Potvrzený rozpis<textarea id="schedule" spellcheck="false"></textarea></label>
  <button id="createFeed">Vytvořit šifrovaný feed</button>
  <div class="status" id="status"></div>
</section>
<section>
  <label>data/schedule.enc.json - jediný soubor určený pro publikaci<textarea id="feed" readonly spellcheck="false"></textarea></label>
</section>
<script src="../private-schedule-feed.js?v=3"></script>
<script>
(function(){
  var api=window.LazenskySchedule;
  var status=document.getElementById('status');
  function setStatus(text){status.textContent=text}
  function json(id){return JSON.parse(document.getElementById(id).value)}
  document.getElementById('loadPublicKey').onclick=function(){
    fetch('../data/schedule-public-key.json',{cache:'no-store'}).then(function(response){
      if(!response.ok)throw new Error('Veřejný klíč není dostupný.');
      return response.text();
    }).then(function(value){document.getElementById('publicKey').value=value;setStatus('Produkční veřejný klíč je načten.');}).catch(function(error){setStatus(error.message)});
  };
  document.getElementById('createFeed').onclick=function(){
    try{
      api.createEncryptedFeed(json('schedule'),json('publicKey')).then(function(result){
        document.getElementById('feed').value=JSON.stringify(result.feed,null,2);
        setStatus('Šifrovaný feed verze '+result.schedule.scheduleVersion+' je připraven k publikaci.');
      }).catch(function(error){setStatus(error.message)});
    }catch(error){setStatus(error.message)}
  };
})();
</script>
