<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bohanes CRM">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Bohanes CRM</title>
<link rel="icon" type="image/svg+xml" href="./favicon-final.svg">
<link rel="shortcut icon" type="image/svg+xml" href="./favicon-final.svg">
<style>
:root{--navy:#0B3B5B;--line:#c9d8e2;--bg:#eef3f8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.crm-shell{position:fixed;inset:0;display:grid;grid-template-rows:52px 1fr}.crm-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);z-index:2}.crm-title{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800}.crm-title img{width:32px;height:32px}.crm-actions{display:flex;gap:8px}.crm-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);text-decoration:none;font-size:13px;font-weight:750}.crm-actions a.active{background:var(--navy);border-color:var(--navy);color:#fff}.crm-frame{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:640px){.crm-toolbar{padding:0 10px}.crm-title span{display:none}.crm-actions a{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div class="crm-shell">
  <div class="crm-toolbar">
    <div class="crm-title"><img src="./favicon-final.svg" alt=""><span>Obchodní CRM</span></div>
    <nav class="crm-actions" aria-label="Interní navigace">
      <a href="/#domu">Veřejný web</a>
      <a href="/hq/">Statistiky</a>
      <a class="active" href="/crm/" aria-current="page">CRM</a>
    </nav>
  </div>
  <iframe class="crm-frame" title="Bohanes Technologies CRM" src="https://bohanes-technologies-crm.vercel.app/?_vercel_share=iBrAAvzsNJmyT1b4i2mCmN5hCHTTmMVD" allow="clipboard-read; clipboard-write"></iframe>
</div>
</body>
</html>
