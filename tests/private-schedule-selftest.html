<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Private schedule self-test</title>
<pre id="result">SELFTEST BUILD: 4
Spouštím test…</pre>
<script>window.__lkDisableAutoSync=true;</script>
<script src="../private-schedule-feed.js?v=2"></script>
<script>
(async function(){
  var result=document.getElementById('result');
  var originalFetch=window.fetch;
  var temporaryStorageKeys=['lazensky_commander_local_settings_v1','lazensky_commander_confirmed_schedule_v1','lazensky_commander_schedule_v10','lazensky_commander_legacy_mirror_v1'];
  var savedStorage={};
  function assert(condition,message){if(!condition)throw new Error(message)}
  function restoreStorage(){temporaryStorageKeys.forEach(function(key){if(savedStorage[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,savedStorage[key]);});}
  try{
    temporaryStorageKeys.forEach(function(key){savedStorage[key]=localStorage.getItem(key);localStorage.removeItem(key);});
    var fixture=await originalFetch('../fixtures/confirmed-schedule.synthetic.json',{cache:'no-store'}).then(function(response){return response.json()});
    var publicKey=await originalFetch('../data/schedule-public-key.json',{cache:'no-store'}).then(function(response){return response.json()});
    var pairingToken=new URLSearchParams(location.hash.slice(1)).get('pair');
    assert(pairingToken,'Otevřete test s párovacím fragmentem.');
    var startHash=location.hash;
    var paired=await LazenskySchedule.consumePairingFragment();
    assert(paired&&startHash&&location.hash==='','Párovací fragment nebyl odstraněn.');
    assert(await LazenskySchedule.privateKeyAvailable(),'Soukromý klíč se neuložil.');
    assert(await LazenskySchedule.privateKeyIsNonExtractable(),'Soukromý klíč je exportovatelný.');
    var roundTrip=await LazenskySchedule.createEncryptedFeed(fixture,publicKey);
    assert(!Object.prototype.hasOwnProperty.call(roundTrip.feed.crypto,'keyIv'),'Feed obsahuje nepoužívané RSA IV.');
    assert((await LazenskySchedule.decryptFeed(roundTrip.feed)).scheduleVersion===fixture.scheduleVersion,'RSA-OAEP/AES-GCM round-trip selhal.');
    var activeFeed=await originalFetch('../data/schedule.enc.json',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('Produkční šifrovaný rozpis není dostupný.');return response.json()});
    LazenskySchedule.validateFeed(activeFeed);
    var decrypted=await LazenskySchedule.decryptFeed(activeFeed);
    assert(decrypted.scheduleVersion===activeFeed.scheduleVersion,'scheduleVersion neodpovídá skutečnému feedu.');
    window.fetch=function(){return Promise.resolve({status:200,ok:true,json:function(){return Promise.resolve(activeFeed)}})};
    var firstResult=await LazenskySchedule.refreshPrivateSchedule();
    assert(firstResult.status==='updated'||firstResult.status==='current','Skutečný šifrovaný rozpis se nenačetl.');
    var schedule=LazenskySchedule.getSchedule();
    assert(schedule.events.filter(function(event){return event.kind==='meal'}).length===9,'Jídla nejsou součástí potvrzeného modelu.');
    var bath=schedule.events.filter(function(event){return event.stableId==='synthetic-0815-bath'})[0];
    var typeDecision=LazenskySchedule.explainLeadTime(bath,schedule);
    assert(typeDecision.procedureType==='Jodobromová koupel'&&typeDecision.normalizedType==='jodobromová koupel','Nenalezen správný typ procedury.');
    assert(typeDecision.automaticEventOverride===null&&typeDecision.automaticTypeOverride===30,'Automatický override typu není v potvrzeném rozpisu.');
    assert(typeDecision.localDefault===null&&typeDecision.localTypeOverride===null&&typeDecision.localEventOverride===null,'Self-test nebyl izolován od místních override.');
    assert(typeDecision.effectiveLeadTimeMinutes===30&&typeDecision.source==='type','Override typu procedury nefunguje.');
    assert(LazenskySchedule.calendarContract(schedule).filter(function(event){return event.stableId==='synthetic-0815-bath'})[0].leadTimeMinutes===30,'Kalendářový kontrakt nepoužívá produkční override typu.');
    var panel=document.createElement('div');
    panel.innerHTML=LazenskySchedule.renderNotificationSettings();
    LazenskySchedule.bindNotificationSettings(panel.firstElementChild);
    var bathInput=panel.querySelector('[data-lk-lead-group="procedure"][data-lk-lead-type="Jodobromová koupel"]');
    bathInput.value='35';
    bathInput.dispatchEvent(new Event('change',{bubbles:true}));
    var localDecision=LazenskySchedule.explainLeadTime(bath,schedule);
    assert(localDecision.localTypeOverride===35&&localDecision.effectiveLeadTimeMinutes===35&&localDecision.source==='local-type','Lokální override nemá přednost.');
    assert(LazenskySchedule.calendarContract(schedule).filter(function(event){return event.stableId==='synthetic-0815-bath'})[0].leadTimeMinutes===35,'Kalendářový kontrakt nepoužívá místní override.');
    window.fetch=function(){return Promise.reject(new Error('offline'))};
    try{await LazenskySchedule.refreshPrivateSchedule()}catch(error){}
    assert(LazenskySchedule.getSchedule().scheduleVersion===activeFeed.scheduleVersion,'Offline stav přepsal poslední platný rozpis.');
    activeFeed=JSON.parse(JSON.stringify(activeFeed));
    activeFeed.scheduleVersion+=1;
    activeFeed.crypto.ciphertext=activeFeed.crypto.ciphertext.slice(0,-1)+(activeFeed.crypto.ciphertext.slice(-1)==='A'?'B':'A');
    window.fetch=function(){return Promise.resolve({status:200,ok:true,json:function(){return Promise.resolve(activeFeed)}})};
    try{await LazenskySchedule.refreshPrivateSchedule();throw new Error('Poškozený feed byl přijat.')}catch(error){assert(LazenskySchedule.getSchedule().scheduleVersion===decrypted.scheduleVersion,'Poškozený feed změnil uložený rozpis.')}
    result.textContent='SELFTEST BUILD: 4\nPASS: RSA-OAEP, AES-GCM, párovací fragment, verze, offline fallback a lokální override.';
  }catch(error){result.textContent='SELFTEST BUILD: 4\nFAIL: '+error.message;throw error}
  finally{window.fetch=originalFetch;restoreStorage()}
})();
</script>
