name: Google OIDC smoke test

on:
  push:
    branches:
      - lc/watch-activitykit-v1
    paths:
      - .github/workflows/google-oidc-smoke.yml

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange GitHub OIDC for short-lived Google token
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: lazensky-commander
          workload_identity_provider: projects/217549425263/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: lazensky-commander-calendar-sy@lazensky-commander.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify keyless credentials exist without calling Calendar API
        id: verify
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          test -n "$ACCESS_TOKEN"
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "OIDC/WIF authentication OK"

      - name: Publish smoke-test result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$AUTH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="GitHub OIDC/WIF authentication succeeded"
          else
            STATE=failure
            DESCRIPTION="GitHub OIDC/WIF authentication failed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"google-oidc-smoke\",\"description\":\"${DESCRIPTION}\"}"
          test "$STATE" = "success"
