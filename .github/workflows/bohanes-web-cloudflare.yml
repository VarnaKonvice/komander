name: Bohanes web - approved Cloudflare release

# Safety gate: ordinary commits to main must NEVER deploy the canonical public site.
# A separately approved web-release-* tag is required for production deployment.
# Normal work-in-progress commits to main are deployed only by the preview workflow.
on:
  push:
    tags:
      - "web-release-*"

permissions:
  contents: read

concurrency:
  group: bohanes-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify website assets before deployment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("docs/bohanes-technologies/web/site")
          required = [
              "index.html", "jedu-do-lazni.html", "podrobnosti.html",
              "o-nas.html", "pro-lazne.html", "b2c-front.css",
              "unified-refinement.css", "screens/apple-calendar-darkov-monday-morning-2025.webp",
              "video-ukazky/Commander-Short-V6-web.mp4",
          ]
          for file in required:
              assert (site / file).is_file() and (site / file).stat().st_size > 0, file
          home = (site / "index.html").read_text()
          guide = (site / "jedu-do-lazni.html").read_text()
          details = (site / "podrobnosti.html").read_text()
          assert "Stačí tři jednoduché kroky" in home
          assert guide.index('id="prehled"') < guide.index('id="demo-pobyt"')
          assert "Praktický průvodce" in guide
          assert "apple-calendar-darkov-monday-morning-2025.webp" in details
          print("Verified approved website structure and assets")
          PY

      - name: Deploy approved website to existing Cloudflare Pages production
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: "1ee27367a52d5a16d792876e6b38076a"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Missing repository Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4.162.0 pages deploy docs/bohanes-technologies/web/site \
            --project-name bohanes-technologies \
            --branch main \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "Approved Bohanes website release"
