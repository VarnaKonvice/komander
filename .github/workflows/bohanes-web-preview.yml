name: Bohanes web - automatic preview (not production)

# Changes to website in main update only the separate Cloudflare showcase project.
# The public bohanes-technologies.cz site must never be deployed from this workflow.
on:
  push:
    branches:
      - main
    paths:
      - "docs/bohanes-technologies/web/site/**"
      - ".github/workflows/bohanes-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bohanes-web-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for preview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify and prepare safe showcase package
        shell: bash
        run: |
          set -euo pipefail
          src="docs/bohanes-technologies/web/site"
          for required in index.html podrobnosti.html jedu-do-lazni.html o-nas.html pro-lazne.html unified-refinement.css; do
            test -s "$src/$required"
          done
          dest="$RUNNER_TEMP/bohanes-web-preview"
          python3 docs/bohanes-technologies/web/prepare-public-release.py "$dest"
          # Explicitly prohibit accidental redirect to the public production website.
          rm -f "$dest/_redirects"
          cat > "$dest/_headers" <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            Referrer-Policy: strict-origin-when-cross-origin
            X-Content-Type-Options: nosniff
          /*.html
            Cache-Control: no-cache, max-age=0, must-revalidate
          /manifest.webmanifest
            Cache-Control: no-cache, max-age=0, must-revalidate
          HEADERS
          echo "Preview-only package verified"

      - name: Check whether Cloudflare deployment is configured
        id: cloudflare_access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub validation passed. Cloudflare automatic preview deploy is not configured; add CLOUDFLARE_API_TOKEN as an Actions repository secret. Existing preview remains online."
          fi

      - name: Deploy only to Bohanes Technologies showcase
        if: steps.cloudflare_access.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: "1ee27367a52d5a16d792876e6b38076a"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_PROJECT: bohanes-technologies-ukazka
        run: |
          set -euo pipefail
          test "$PREVIEW_PROJECT" = 'bohanes-technologies-ukazka'
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          npx --yes wrangler@4.162.0 pages deploy "$RUNNER_TEMP/bohanes-web-preview" \
            --project-name "$PREVIEW_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'Bohanes web preview from main (never public production)'
