name: Calendar keyless auth smoke

on:
  push:
    branches:
      - lc/watch-activitykit-v1
    paths:
      - .github/workflows/calendar-keyless-auth-smoke.yml
      - .github/workflows/google-calendar-sync.yml
      - calendar-sync/google-calendar-adapter.mjs
      - tests/google-calendar-auth-suite.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: lazensky-commander
          workload_identity_provider: projects/217549425263/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: lazensky-commander-calendar-sy@lazensky-commander.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify short-lived ADC only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          case "$GOOGLE_APPLICATION_CREDENTIALS" in
            *gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path" >&2; exit 1 ;;
          esac
          echo "OIDC/WIF authentication succeeded; no Calendar write was attempted."
