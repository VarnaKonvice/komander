name: Calendar keyless auth smoke

on:
  push:
    branches:
      - lc/watch-activitykit-v1
    paths:
      - .github/workflows/calendar-keyless-auth-smoke.yml
      - .github/workflows/google-calendar-sync.yml
      - calendar-sync/google-calendar-adapter.mjs
      - tests/google-calendar-auth-suite.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/calendar-keyless-auth-smoke.yml
      - .github/workflows/google-calendar-sync.yml
      - calendar-sync/google-calendar-adapter.mjs
      - tests/google-calendar-auth-suite.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calendar-sync/package-lock.json

      - name: Install calendar sync dependencies
        run: npm ci --prefix calendar-sync --ignore-scripts

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: lazensky-commander
          workload_identity_provider: projects/217549425263/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: lazensky-commander-calendar-sy@lazensky-commander.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify short-lived ADC only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          case "$GOOGLE_APPLICATION_CREDENTIALS" in
            *gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path" >&2; exit 1 ;;
          esac
          echo "OIDC/WIF authentication succeeded; no Calendar write was attempted."

      - name: Verify read access to Commander calendars
        env:
          LC_GOOGLE_CALENDAR_PROCEDURES_ID: db2404031f09c22434d9bdd742fc36923f883dd7ce74e226eede91eff7251e52@group.calendar.google.com
          LC_GOOGLE_CALENDAR_MEALS_ID: 9cff5505c1e7952468ba2655da0bb69a7a06d35e80afe6787f7b9785f99a1fb9@group.calendar.google.com
        shell: bash
        run: |
          set -euo pipefail
          cd calendar-sync
          node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const auth = new GoogleAuth({ scopes: ['https://www.googleapis.com/auth/calendar.readonly'] });
          const client = await auth.getClient();
          const calendars = [
            ['Procedury', process.env.LC_GOOGLE_CALENDAR_PROCEDURES_ID],
            ['Jídlo', process.env.LC_GOOGLE_CALENDAR_MEALS_ID]
          ];

          for (const [name, id] of calendars) {
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}`;
            const response = await client.request({ method: 'GET', url });
            if (!response?.data?.id) throw new Error(`${name}: Calendar metadata was not readable.`);
            console.log(`${name}: read access OK`);
          }

          console.log('Calendar ACL read smoke succeeded; no Calendar write was attempted.');
          NODE
